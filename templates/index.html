<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To Do List</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light p-4">

    <div class="container" style="max-width: 800px;">

        <h1 class="text-center mb-4 fw-bold">To Do List</h1>

        <!-- Table of ToDo Items -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-light fw-semibold">
                Current Tasks
            </div>

            <table class="table table-hover mb-0">
                <thead class="table-secondary">
                    <tr>
                        <th>Task</th>
                        <th>Email</th>
                        <th>Priority</th>
                        <th style="width: 120px;">Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in items %}
                    <tr>
                        <td>{{ item.task }}</td>
                        <td>{{ item.email }}</td>
                        <td>{{ item.priority }}</td>
                        <td>
                            <form action="/delete/{{ loop.index0 }}" method="POST">
                                <button class="btn btn-danger btn-sm w-100">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- Add New To Do Item Form -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-light fw-semibold">
                Add New To Do Item
            </div>

            <div class="card-body">
                <form action="/submit" method="POST">

                    <div class="mb-3">
                        <label class="form-label">Task</label>
                        <input type="text" name="task" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="text" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Priority</label>
                        <select name="priority" class="form-select">
                            <option>Low</option>
                            <option>Medium</option>
                            <option>High</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Add To Do Item
                    </button>
                </form>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="d-flex gap-3">
            <form action="/clear" method="POST" class="flex-fill">
                <button class="btn btn-danger w-100">Clear List</button>
            </form>

            <form action="/save" method="POST" class="flex-fill">
                <button class="btn btn-secondary w-100">Save</button>
            </form>
        </div>

    </div>

</body>
</html>
